<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Performance Meals | استبيان البرنامج الغذائي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--red:#F5000A;--red-d:#b80008;--bg:#000;--card:#141414;--line:#2c2c2c;--mut:#9b9b9b;--txt:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif}
body{min-height:100vh;min-height:100dvh}
#app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header{padding:14px 20px 10px;position:sticky;top:0;background:var(--bg);z-index:5}
.plates{display:flex;align-items:center;gap:4px;height:30px}
.plates i{flex:1;background:#262626;border-radius:2px;transition:background .25s}
.plates i.on{background:var(--red)}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
main{flex:1;padding:8px 20px 130px}
h1{font-size:28px;line-height:1.35;margin:14px 0 4px;font-weight:900}
.sub{color:var(--mut);margin:0 0 6px;font-size:15px}
.q{margin-top:26px;scroll-margin-top:90px}
.q>.l{font-weight:700;font-size:17px;margin-bottom:12px;display:flex;gap:8px;align-items:baseline}
.q>.l small{color:var(--mut);font-weight:500;font-size:12px}
.q.err>.l{color:var(--red)}
.q.err .chips .c,.q.err input.t{border-color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.c{font:inherit;font-size:15px;font-weight:500;color:var(--txt);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;min-height:48px;cursor:pointer;transition:background .15s,border-color .15s;text-align:center}
.c.fill{flex:1 1 0}
.c[aria-pressed=true]{background:var(--red);border-color:var(--red);font-weight:700}
.c[aria-pressed=true]::before{content:"✓ ";font-size:13px}
.c:focus-visible,.btn:focus-visible,.pm:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #fff;outline-offset:2px}
input.t,textarea{width:100%;font:inherit;font-size:17px;color:var(--txt);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px}
textarea{min-height:120px;resize:vertical}
.sl{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 14px 18px}
.sl.hint{}
.sl .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sl .val{font-size:44px;font-weight:900;line-height:1;text-align:center;flex:1;transition:color .2s}
.sl .val span{font-size:15px;font-weight:500;color:var(--mut);margin-right:6px}
.sl.un .val{color:#5a5a5a}
.pm{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);background:#000;color:#fff;font-size:28px;line-height:1;cursor:pointer;font-family:inherit}
.pm:active{background:var(--red);border-color:var(--red)}
input[type=range]{direction:ltr;width:100%;height:36px;background:transparent;-webkit-appearance:none;appearance:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:#2c2c2c;border-radius:3px}
input[type=range]::-moz-range-track{height:6px;background:#2c2c2c;border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:8px;background:var(--red);border:3px solid #fff;margin-top:-12px}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:8px;background:var(--red);border:3px solid #fff}
.ends{display:flex;justify-content:space-between;direction:ltr;font-size:12px;color:var(--mut);margin-top:2px}
.note{font-size:13px;color:var(--mut);margin-top:10px;min-height:18px}
.note b{color:#fff}
.bar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(to top,#000 70%,rgba(0,0,0,0));padding:26px 20px calc(16px + env(safe-area-inset-bottom));z-index:6}
.bar .in{max-width:520px;margin:0 auto;display:flex;gap:10px}
.btn{font:inherit;font-size:18px;font-weight:900;border:0;border-radius:14px;min-height:56px;cursor:pointer;color:#fff;background:var(--red);flex:1}
.btn:active{background:var(--red-d)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);flex:0 0 96px;font-weight:700}
.btn.sec{background:var(--card);border:1.5px solid var(--line);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:#fff;color:#000;font-weight:700;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}
.hero{text-align:center;padding-top:8px}
.hero img{width:100%;max-width:340px;display:block;margin:0 auto}
.hero h1{font-size:30px;margin-top:22px}
.hero .sub{font-size:16px;line-height:1.8}
.facts{display:flex;justify-content:center;gap:10px;margin:22px 0 0;flex-wrap:wrap}
.facts span{border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700}
details{margin-top:22px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
summary{font-weight:700;cursor:pointer}
details pre{white-space:pre-wrap;font:inherit;font-size:14px;line-height:1.9;color:#ddd;margin:12px 0 0}
.fade{animation:f .22s ease-out}
@keyframes f{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.plates i,.c{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header id="hd" hidden><div class="plates" id="plates"></div><div class="meta"><span id="stepTxt"></span><span>Performance Meals</span></div></header>
  <main id="main"></main>
</div>
<div class="bar" id="bar"><div class="in" id="barIn"></div></div>
<div class="toast" id="toast"></div>

 {k:'time',l:'خلال قديش؟',type:'single',o:['شهر','شهرين إلى 3','4 إلى 6 أشهر','ما في استعجال'],showIf:GOAL_W},
 {k:'why',l:'شو الدافع الأكبر؟',hint:'ممكن أكتر من واحد',type:'multi',o:['صحتي','شكلي','مناسبة قريبة','توصية طبيب','ثقتي بنفسي','منافسة رياضية']}]},
{t:'حالتك الصحية',qs:[
 {k:'cond',l:'هل عندك أي من هدول؟',type:'multi',ex:['لا يوجد'],o:['سكري','ضغط','غدة درقية','كوليسترول','قولون','فقر دم','مشاكل كلى أو كبد','لا يوجد']},
 {k:'fem',l:'وضعك حالياً',type:'single',o:['دورة منتظمة','دورة غير منتظمة','حامل','مرضعة','انقطاع الطمث'],showIf:a=>a.gender==='أنثى'}]},
{t:'أدوية ومكملات',qs:[
 {k:'meds',l:'شو بتستخدم حالياً؟',type:'multi',ex:['ولا شي'],o:['أدوية سكر','أدوية ضغط','أدوية غدة','مضاد اكتئاب أو قلق','حبوب منع حمل','فيتامينات','بروتين باودر','كرياتين','ولا شي']},
 {k:'labs',l:'تحاليل دم حديثة؟',type:'single',o:['عندي وبرسلها','ما عندي','من أكثر من سنة']}]},
{t:'الحساسية والمحاذير',qs:[
 {k:'allergy',l:'حساسية أو عدم تحمّل',type:'multi',ex:['لا يوجد'],o:['لاكتوز','غلوتين','مكسرات','فول سوداني','بيض','مأكولات بحرية','لا يوجد']},
 {k:'avoid',l:'أكلات ما بتاكلها',hint:'لأي سبب',type:'multi',ex:['لا يوجد'],o:['لحم أحمر','دجاج','سمك','تونا','بيض','ألبان وأجبان','بقوليات','خضار','لا يوجد']}]},
{t:'نمط حياتك',qs:[
 {k:'job',l:'طبيعة شغلك',type:'single',o:['مكتبي','حركي','دوام ليلي أو متغير','ما بشتغل']},
 {k:'sleep',l:'ساعات نومك',type:'single',o:['أقل من 5','5 إلى 6','7 إلى 8','أكتر من 8']},
 {k:'stress',l:'مستوى التوتر',type:'single',o:['هادئ','متوسط','عالي']}]},
{t:'تمرينك',qs:[
 {k:'ex',l:'شو بتمارس؟',type:'multi',ex:['ما بتمرن'],o:['أوزان','كارديو','كروس فيت','رياضة جماعية','مشي','ما بتمرن']},
 {k:'exd',l:'كم يوم بالأسبوع؟',type:'single',o:['1 إلى 2','3 إلى 4','5 إلى 6','كل يوم'],showIf:NOEX},
 {k:'ext',l:'وقت تمرينك',type:'single',o:['صباحاً','ظهراً','مساءً','متغير'],showIf:NOEX},
 {k:'exp',l:'وين بتتمرن؟',type:'multi',o:['نادي','البيت','برا'],showIf:NOEX}]},
{t:'أكلك اليومي',qs:[
 {k:'meals',l:'كم وجبة باليوم؟',type:'single',o:['2','3','4','5 أو أكثر']},
 {k:'bf',l:'الفطور',type:'single',o:['أول ما أصحى','متأخر','بتخطاه']},
 {k:'cook',l:'مين بيطبخ؟',type:'single',o:['أنا','الأهل','طباخ أو مساعدة','مطاعم وتوصيل']},
 {k:'out',l:'كم مرة بتاكل برا؟',type:'single',o:['نادراً','1 إلى 2 بالأسبوع','3 إلى 4','تقريباً كل يوم']}]},
{t:'شو بتحب تاكل؟',sub:'بنبني البرنامج على أكلات بتحبها',qs:[
 {k:'prot',l:'البروتينات المفضلة',type:'multi',o:['دجاج','لحم','سمك','تونا','بيض','لبنة وأجبان','بقوليات','بروتين باودر']},
 {k:'carb',l:'النشويات المفضلة',type:'multi',o:['رز','خبز','معكرونة','بطاطا','شوفان','برغل وفريكة','ذرة']}]},
{t:'عاداتك',qs:[
 {k:'water',l:'الماء باليوم',type:'single',o:['أقل من 4 أكواب','4 إلى 6','7 إلى 8','أكتر من 8']},
 {k:'coffee',l:'فناجين قهوة أو شاي باليوم',type:'single',o:['0','1 إلى 2','3 إلى 4','5 أو أكثر']},
 {k:'soda',l:'مشروبات غازية أو عصائر',type:'single',o:['ما بشرب','أحياناً','يومياً']},
 {k:'sweet',l:'الحلويات',type:'single',o:['نادراً','كم مرة بالأسبوع','يومياً']}]},
{t:'تجاربك السابقة',qs:[
 {k:'past',l:'أنظمة جربتها',type:'multi',ex:['ما جربت'],o:['كيتو','صيام متقطع','عد سعرات','دايت جاهز','أدوية أو حقن','ما جربت']},
 {k:'res',l:'شو كانت النتيجة؟',type:'single',o:['نجحت واستمريت','نزلت ورجعت','ما نجحت','ما قدرت أكمل'],showIf:a=>a.past&&!(a.past.length===1&&a.past[0]==='ما جربت')},
 {k:'hard',l:'أصعب شي عليك',hint:'ممكن أكتر من واحد',type:'multi',ex:['ما في صعوبة'],o:['جوع ليلي','الحلويات','أكل عاطفي','العزايم','قلة وقت','ملل من الأكل','ما في صعوبة']}]},
{t:'الالتزام والمتابعة',qs:[
 {k:'budget',l:'ميزانية الأكل',type:'single',o:['اقتصادية','متوسطة','مفتوحة']},
 {k:'commit',l:'قديش جاهز تلتزم؟',hint:'1 بالكاد، 10 مية بالمية',type:'slider',min:1,max:10,def:7,unit:'من 10'},
 {k:'follow',l:'كيف بتفضل المتابعة؟',type:'single',o:['واتساب يومي','واتساب أسبوعي','مكالمة أسبوعية']}]},
{t:'آخر شي',sub:'اختياري بالكامل',qs:[
 {k:'notes',l:'في شي بدك أعرفه عنك؟',type:'area',opt:1,ph:'اكتب هون لو حابب'}]}
];

const a={}; let i=-1; // -1 ترحيب ، STEPS.length شاشة الإرسال
const $=s=>document.querySelector(s);
const main=$('#main'), barIn=$('#barIn');
const N=STEPS.length;
const vis=st=>st.qs.filter(q=>!q.showIf||q.showIf(a));
const done=q=>{const v=a[q.k];return v!==undefined&&v!==''&&!(Array.isArray(v)&&!v.length)};
const defv=q=>typeof q.def==='function'?q.def(a):q.def;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// شريط الأوزان: مقاطع متناظرة مثل الباربل بالشعار
(function(){const p=$('#plates');for(let k=0;k<N;k++){const d=Math.abs(k-(N-1)/2)/((N-1)/2);const e=document.createElement('i');e.style.height=(8+(1-d)*22)+'px';p.appendChild(e)}})();

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}

function progress(){
  const hd=$('#hd');hd.hidden=(i<0||i>=N);
  document.querySelectorAll('#plates i').forEach((e,k)=>e.classList.toggle('on',k<=i));
  $('#stepTxt').textContent=(i+1)+' من '+N;
}

function qHTML(q){
  let h=`<div class="q" data-k="${q.k}"><div class="l">${q.l}${q.hint?`<small>${q.hint}</small>`:''}${q.opt&&!q.hint?'<small>اختياري</small>':''}</div>`;
  if(q.type==='text') h+=`<input class="t" type="text" data-k="${q.k}" value="${esc(a[q.k]||'')}" placeholder="${q.ph||''}" autocomplete="name">`;
  else if(q.type==='area') h+=`<textarea data-k="${q.k}" placeholder="${q.ph||''}">${esc(a[q.k]||'')}</textarea>`;
  else if(q.type==='single'||q.type==='multi'){
    const fill=q.o.length<=3?' fill':'';
    h+='<div class="chips">'+q.o.map(o=>{const v=a[q.k];const on=q.type==='single'?v===o:(v||[]).includes(o);return `<button type="button" class="c${fill}" data-k="${q.k}" data-o="${esc(o)}" aria-pressed="${on}">${o}</button>`}).join('')+'</div>';
  } else if(q.type==='slider'){
    const val=a[q.k]!==undefined?a[q.k]:defv(q);
    h+=`<div class="sl ${a[q.k]===undefined?'un':''}" data-k="${q.k}"><div class="row"><button type="button" class="pm" data-d="1" aria-label="زيادة">+</button><div class="val"><b>${val}</b><span>${q.unit}</span></div><button type="button" class="pm" data-d="-1" aria-label="نقصان">−</button></div><input type="range" min="${q.min}" max="${q.max}" step="1" value="${val}" aria-label="${q.l}"><div class="ends"><span>${q.min}</span><span>${q.max}</span></div>${q.delta?'<div class="note" id="dl"></div>':''}</div>`;
  }
  return h+'</div>';
}

function delta(){const n=$('#dl');if(!n)return;const t=a.target!==undefined?a.target:(a.weight||75),w=a.weight||75,d=Math.round((t-w)*10)/10;
  n.innerHTML=a.target===undefined?'حرّك الشريط لتحديد وزنك المستهدف':(d===0?'نفس وزنك الحالي':`<b>${Math.abs(d)} كغ</b> ${d<0?'أقل':'أكثر'} من وزنك الحالي (${w} كغ)`)}

function show(n){
  i=n;progress();
  main.innerHTML='';main.classList.remove('fade');void main.offsetWidth;main.classList.add('fade');
  if(i<0) welcome(); else if(i>=N) finish(); else step();
  window.scrollTo(0,0);
}

function welcome(){
  main.innerHTML=`<div class="hero"><img src="${LOGO}" alt="Performance Meals"><h1>برنامجك الغذائي على مقاسك</h1><p class="sub">جاوب على أسئلة قصيرة، أغلبها ضغطة زر.<br>كل ما كانت إجاباتك أدق، كان برنامجك أدق.</p><div class="facts"><span>حوالي 4 دقائق</span><span>${N} خطوة</span><span>معلوماتك سرّية</span></div></div>`;
  barIn.innerHTML='<button class="btn" id="go">يلا نبدأ</button>';
  $('#go').onclick=()=>show(0);
}

function step(){
  const st=STEPS[i];
  main.innerHTML=`<h1>${st.t}</h1>${st.sub?`<p class="sub">${st.sub}</p>`:''}<div id="qs">${vis(st).map(qHTML).join('')}</div>`;
  if(st.qs.some(q=>q.delta)) delta();
  barIn.innerHTML=`<button class="btn ghost" id="back">رجوع</button><button class="btn" id="next">${i===N-1?'خلّصت':'التالي'}</button>`;
  $('#back').onclick=()=>show(i-1);
  $('#next').onclick=next;
}

function next(){
  const miss=vis(STEPS[i]).filter(q=>!q.opt&&!done(q));
  document.querySelectorAll('.q.err').forEach(e=>e.classList.remove('err'));
  if(miss.length){
    miss.forEach(q=>{const e=document.querySelector(`.q[data-k="${q.k}"]`);if(e)e.classList.add('err')});
    document.querySelector('.q.err').scrollIntoView({behavior:'smooth',block:'center'});
    toast('جاوب على الأسئلة المعلّمة بالأحمر');return;
  }
  show(i+1);
}

function setSlider(box,q,v){
  v=Math.max(q.min,Math.min(q.max,v));a[q.k]=v;
  box.classList.remove('un');box.querySelector('.val b').textContent=v;box.querySelector('input').value=v;
  const e=box.closest('.q');if(e)e.classList.remove('err');delta();
}

main.addEventListener('click',e=>{
  const c=e.target.closest('.c');
  if(c){
    const q=findQ(c.dataset.k),o=c.dataset.o;
    if(q.type==='single') a[q.k]=o;
    else{
      let v=a[q.k]||[];
      if(v.includes(o)) v=v.filter(x=>x!==o);
      else if(q.ex&&q.ex.includes(o)) v=[o];
      else v=v.filter(x=>!(q.ex&&q.ex.includes(x))).concat(o);
      a[q.k]=v;
    }
    const y=window.scrollY;step();window.scrollTo(0,y);return;
  }
  const pm=e.target.closest('.pm');
  if(pm){const box=pm.closest('.sl'),q=findQ(box.dataset.k);const cur=a[q.k]!==undefined?a[q.k]:defv(q);setSlider(box,q,a[q.k]===undefined&&false?cur:cur+ +pm.dataset.d)}
});
main.addEventListener('input',e=>{
  const t=e.target;
  if(t.type==='range'){const box=t.closest('.sl');setSlider(box,findQ(box.dataset.k),+t.value)}
  else if(t.dataset&&t.dataset.k){a[t.dataset.k]=t.value.trim();t.closest('.q').classList.remove('err')}
});
function findQ(k){for(const s of STEPS)for(const q of s.qs)if(q.k===k)return q}

// ملخص الإجابات لرسالة المدرب
function summary(){
  const L=[];L.push('*استبيان برنامج غذائي - Performance Meals*');
  STEPS.forEach(st=>{
    const rows=[];
    vis(st).forEach(q=>{
      let v=a[q.k];
      if(v===undefined||v===''||(Array.isArray(v)&&!v.length)){ if(q.opt) return; v='لم يُجب' }
      if(Array.isArray(v)) v=v.join('، ');
      else if(q.type==='slider') v=v+' '+q.unit;
      rows.push(`- ${q.l}: ${v}`);
    });
    if(st.qs.some(q=>q.k==='height')&&a.height&&a.weight){const b=a.weight/Math.pow(a.height/100,2);rows.push(`- مؤشر كتلة الجسم: ${b.toFixed(1)}`)}
    if(st.qs.some(q=>q.k==='target')&&a.target!==undefined&&a.weight&&GOAL_W(a)){const d=Math.round((a.target-a.weight)*10)/10;rows.push(`- الفرق المطلوب: ${d>0?'+':''}${d} كغ`)}
    if(rows.length) L.push('\n*'+st.t+'*\n'+rows.join('\n'));
  });
  return L.join('\n');
}

function copy(txt){
  if(navigator.clipboard&&window.isSecureContext) return navigator.clipboard.writeText(txt);
  const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();return Promise.resolve();
}

function finish(){
  const msg=summary();const nm=esc(a.name||'');
  main.innerHTML=`<div class="hero"><img src="${LOGO}" alt="" style="max-width:220px"><h1>تمام${nm?' يا '+nm.split(' ')[0]:''}، خلصنا</h1><p class="sub">${COACH_PHONE?'اضغط الزر لإرسال إجاباتك لي على واتساب، وبيوصلك برنامجك بأقرب وقت.':'اضغط الزر لنسخ إجاباتك، وأرسلها لي على واتساب.'}</p></div><details><summary>راجع إجاباتك</summary><pre>${esc(msg)}</pre></details>`;
  const wa=COACH_PHONE?`<button class="btn" id="wa">أرسل عبر واتساب</button><button class="btn sec" id="cp" style="flex:0 0 110px">نسخ</button>`:`<button class="btn" id="cp">نسخ الإجابات</button>`;
  barIn.innerHTML=`<button class="btn ghost" id="back" style="flex:0 0 80px">رجوع</button>${wa}`;
  $('#back').onclick=()=>show(N-1);
  $('#cp').onclick=()=>copy(msg).then(()=>toast('تم النسخ، ألصقها بالواتساب'));
  if($('#wa')) $('#wa').onclick=()=>{window.location.href='https://wa.me/'+COACH_PHONE+'?text='+encodeURIComponent(msg)};
}

show(-1);
</script>
</body>
</html>
